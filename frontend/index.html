<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng nhập hệ thống</title>
    <link rel="stylesheet" href="vendor/fontawesome/css/all.min.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="theme-vulnerable">
    <div class="top-bar">
      <div class="brand"><i class="fas fa-university"></i> Cổng quản trị</div>
      <div class="switch-container">
        <span id="modeLabel"
          ><i class="fas fa-exclamation-triangle"></i> Cảnh báo</span
        >
        <label class="switch">
          <input type="checkbox" id="modeToggle" />
          <span class="slider round"></span>
        </label>
      </div>
    </div>

    <div class="container fade-in">
      <div id="loginSection">
        <h2>Đăng nhập</h2>
        <form id="loginForm">
          <div class="input-group">
            <label><i class="fas fa-user"></i> Tên đăng nhập hoặc Email</label>
            <input
              type="text"
              id="username"
              placeholder="Nhập tài khoản"
              required
            />
          </div>
          <div class="input-group">
            <label><i class="fas fa-lock"></i> Mật khẩu</label>
            <div class="password-wrapper">
              <input
                type="password"
                id="password"
                placeholder="Nhập mật khẩu"
                required
              />
              <i class="fas fa-eye toggle-password" title="Hiện mật khẩu"></i>
            </div>
          </div>
          <div class="options-group">
            <label class="checkbox-label">
              <input type="checkbox" id="rememberMe" /> Ghi nhớ phiên làm việc
            </label>
            <a href="#" id="showForgotBtn" class="link-btn">Quên mật khẩu?</a>
          </div>
          <button type="submit" class="btn-primary" id="loginBtn">
            <i class="fas fa-sign-in-alt"></i> Đăng nhập
          </button>

          <div class="divider"><span>HOẶC</span></div>
          <button type="button" class="btn-outline" id="ssoBtn">
            <i class="fab fa-google"></i> Đăng nhập bằng Google
          </button>
        </form>
      </div>

      <div id="mfaSection" class="hidden">
        <h2>Xác minh bảo mật</h2>
        <p class="subtitle">Vui lòng nhập mã từ ứng dụng Authenticator</p>
        <form id="mfaForm">
          <div class="input-group">
            <input
              type="text"
              id="otpCode"
              placeholder="000 000"
              maxlength="6"
              style="
                text-align: center;
                font-size: 32px;
                letter-spacing: 8px;
                font-weight: bold;
              "
              required
              autocomplete="off"
            />
          </div>
          <button type="submit" class="btn-primary" id="mfaBtn">
            <i class="fas fa-check-circle"></i> Xác nhận mã
          </button>
          <button type="button" class="btn-text mt-20" id="backToLoginFromMfa">
            <i class="fas fa-arrow-left"></i> Quay lại
          </button>
        </form>
      </div>

      <div id="forgotSection" class="hidden">
        <h2>Khôi phục mật khẩu</h2>
        <p class="subtitle">
          Nhập thông tin để nhận liên kết đặt lại mật khẩu an toàn
        </p>
        <form id="forgotForm">
          <div class="input-group">
            <label
              ><i class="fas fa-envelope"></i> Tài khoản cần khôi phục</label
            >
            <input
              type="text"
              id="forgotUsername"
              placeholder="Nhập tên đăng nhập hoặc email"
              required
            />
          </div>
          <button type="submit" class="btn-primary" id="sendResetBtn">
            <i class="fas fa-paper-plane"></i> Gửi yêu cầu
          </button>
          <button type="button" class="btn-text mt-20" id="backToLoginBtn">
            <i class="fas fa-arrow-left"></i> Quay lại đăng nhập
          </button>
        </form>
      </div>

      <div id="messageBox" class="message hidden"></div>
    </div>

    <script src="js/app.js"></script>
  </body>
</html>
