<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trang chủ hệ thống</title>
    <link rel="stylesheet" href="vendor/fontawesome/css/all.min.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="theme-vulnerable dashboard-layout">
    <div
      class="top-bar"
      style="display: flex; justify-content: space-between; align-items: center"
    >
      <div class="brand"><i class="fas fa-university"></i> Cổng quản trị</div>

      <div class="user-menu" style="display: flex; align-items: center">
        <span style="font-size: 18px; margin-right: 20px; font-weight: 600">
          <i class="fas fa-user-circle"></i> Xin chào,
          <b id="welcomeName">Người dùng</b>
        </span>
        <button id="logoutBtn" class="btn-danger-small">
          <i class="fas fa-sign-out-alt"></i> Đăng xuất
        </button>
      </div>
    </div>

    <div class="dashboard-container fade-in">
      <div
        id="userView"
        class="hidden"
        style="max-width: 800px; margin: 0 auto"
      >
        <div class="info-card">
          <h3><i class="fas fa-id-card"></i> Hồ sơ cá nhân</h3>
          <p style="font-size: 18px; margin-bottom: 15px">
            Vai trò hệ thống: <strong class="badge">NGƯỜI DÙNG</strong>
          </p>
          <p style="font-size: 18px">
            Xác minh hai bước:
            <strong id="userMfaStatus" class="badge">Đang tải</strong>
          </p>
        </div>
      </div>

      <div id="adminView" class="hidden">
        <div class="admin-grid">
          <div class="stat-card">
            <div class="stat-icon"><i class="fas fa-users"></i></div>
            <div class="stat-data">
              <h4>Tổng tài khoản</h4>
              <p>1000</p>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-icon"><i class="fas fa-user-shield"></i></div>
            <div class="stat-data">
              <h4>Ban quản trị</h4>
              <p>5</p>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-icon" style="color: var(--accent-color)">
              <i class="fas fa-server"></i>
            </div>
            <div class="stat-data">
              <h4>Trạng thái máy chủ</h4>
              <p id="serverStatusText" style="color: var(--accent-color)">
                Cảnh báo
              </p>
            </div>
          </div>
        </div>

        <div class="action-card">
          <h3><i class="fas fa-database"></i> Danh sách người dùng hệ thống</h3>
          <div class="table-responsive mt-15">
            <table class="admin-table">
              <thead>
                <tr>
                  <th>Tên tài khoản</th>
                  <th>Email</th>
                  <th>Vai trò</th>
                  <th>Xác minh hai bước</th>
                  <th>Hành động</th>
                </tr>
              </thead>
              <tbody id="adminTableBody">
                <tr>
                  <td colspan="5" style="text-align: center">
                    <i class="fas fa-spinner fa-spin"></i> Đang tải dữ liệu từ
                    máy chủ...
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <script src="js/app.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", loadDashboardData);
    </script>
  </body>
</html>
